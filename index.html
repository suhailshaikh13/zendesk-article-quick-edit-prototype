<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Review knowledge · Quick edit prototype</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#303332;background:#f2f3f4;font-synthesis:none;--ink:#303332;--muted:#6d747b;--line:#dedfdf;--blue:#456dc2;--purple:#f0e9f5;--green:#00a86b}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:#eff0f2}button,input{font:inherit}button{cursor:pointer}.scrim{position:fixed;inset:0;background:#10141826}.modal{position:relative;width:min(1440px,96vw);height:min(900px,94vh);min-height:620px;background:#fff;border:1px solid #e2e3e3;border-radius:15px;box-shadow:0 20px 54px #1018282b;overflow:hidden;display:flex;flex-direction:column}.main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr}.left{padding:46px 42px 28px;overflow:auto}.left h1{font-size:28px;letter-spacing:-.035em;line-height:1.2;margin:4px 0 14px}.intro{font-size:15px;line-height:1.55;color:#3e4243;max-width:530px;margin:0 0 28px}.crawler,.item{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;display:flex;align-items:center;gap:13px;padding:15px;text-align:left}.crawler{margin-bottom:12px;cursor:default}.item{transition:border-color .15s,box-shadow .15s}.item:hover{border-color:#abb9d5}.item.active{border:2px solid var(--blue);padding:14px;box-shadow:0 0 0 3px #456dc210}.doc{width:43px;height:43px;border-radius:10px;background:#eef0f2;display:grid;place-items:center;flex:none;color:#34383a}.crawler .doc{background:#e4f0fa;color:#244e70}.doc svg{width:21px;height:21px}.copy{min-width:0}.item-title{display:block;font-size:15px;line-height:1.3;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}.status{display:flex;align-items:center;gap:8px;color:#555d63;font-size:14px;line-height:1.2}.dot{width:11px;height:11px;border:2px solid #9ba4ab;border-radius:50%;flex:none}.dot.published,.dot.complete{border:0;background:var(--green)}.list{display:grid;gap:10px}.right{background:var(--purple);padding:28px 34px;display:flex;flex-direction:column;min-height:0}.right-top{width:min(100%,760px);margin:0 auto 18px;display:flex;align-items:center;justify-content:space-between}.tag{display:inline-flex;align-items:center;background:#9256ae;color:white;border-radius:99px;padding:6px 13px;font-size:13px;font-weight:700}.close{border:0;background:transparent;color:#5b626b;font-size:27px;line-height:1;padding:2px 5px}.card{width:min(100%,760px);margin:0 auto;background:#fff;border:1px solid #dedfdf;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;flex:1;min-height:0}.card-head{padding:16px 20px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:#fafafa}.article-icon{width:44px;height:44px;border-radius:11px;background:#e5f1ff;color:#3f6ec6;display:grid;place-items:center;flex:none}.article-icon svg{width:22px;height:22px}.title-input{height:54px;min-width:0;flex:1;padding:0 16px;border:1px solid #c6c7c7;border-radius:10px;background:#fff;color:#303332;font-size:18px;outline:none}.title-input:focus{border-color:#4d72c2;box-shadow:0 0 0 2px #4d72c224}.toolbar{height:57px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:0;padding:0 24px;background:#fff}.tool{width:49px;height:42px;border:0;border-radius:5px;background:transparent;color:#606765;font-size:24px;display:grid;place-items:center}.tool:hover,.tool[aria-pressed="true"]{background:#f0f2f5;color:#343a38}.tool:focus-visible,.button:focus-visible,.item:focus-visible,.close:focus-visible{outline:3px solid #456dc2;outline-offset:2px}.tool strong{font-size:24px}.tool em{font-style:italic}.tool u{text-underline-offset:3px}.tool-sep{height:37px;border-left:1px solid #dedfdf;margin:0 10px}.article-editor{margin:24px 28px 22px;border:1px solid #c9cccb;border-radius:11px;flex:1;min-height:190px;overflow:auto;padding:22px 25px;color:#424847;font-size:15px;line-height:1.55;outline:none}.article-editor:focus{border-color:#426abd;box-shadow:0 0 0 2px #5578c51a}.article-editor h1,.article-editor h2,.article-editor h3{color:#343836;font-size:16px;line-height:1.35;margin:0 0 13px;font-weight:700}.article-editor p{margin:0 0 15px}.article-editor ul,.article-editor ol{padding-left:20px;margin:0 0 15px}.article-editor li{padding-left:2px;margin:2px 0}.archive-confirm{display:flex;align-items:center;gap:14px;margin:14px 20px 0;padding:12px 14px;border:1px solid #e3b4b5;border-radius:9px;background:#fff6f6;color:#463536}.archive-confirm[hidden]{display:none}.archive-copy{font-size:13px;line-height:1.45;flex:1}.archive-copy strong{display:block;margin-bottom:2px}.archive-buttons{display:flex;gap:8px;flex:none}.archive-button,.cancel-button,.publish-button{border-radius:8px;padding:9px 13px;font-size:13px;font-weight:650;white-space:nowrap}.archive-button{border:1px solid #c93e45;background:#fff;color:#bd3038}.archive-button:hover{background:#fff0f0}.cancel-button{border:1px solid #c8caca;background:#fff;color:#343938}.cancel-button:hover{background:#f2f3f3}.card-actions{border-top:1px solid var(--line);background:#fafafa;padding:14px 22px;display:flex;align-items:center;gap:10px;min-height:69px}.actions-spacer{flex:1}.publish-button{border:0;border-radius:99px;background:#303332;color:white;padding:11px 19px}.publish-button:hover{background:#4b4f4e}.publish-button:disabled{background:#d9dcdb;color:#737978;cursor:default}.footer{height:70px;flex:none;border-top:1px solid #e5e5e5;display:flex;align-items:center;padding:0 32px;gap:18px;background:#fff}.quiet{border:0;background:transparent;color:#303332;font-size:15px;font-weight:600;padding:8px}.footer-link{margin-left:auto;display:inline-flex;align-items:center;gap:8px;color:#456fc6;text-decoration:underline;text-underline-offset:3px;font-size:15px;white-space:nowrap}.footer-link svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}.test-agent{border:1px solid #aeb1af;border-radius:99px;background:white;color:#303332;padding:12px 19px;font-size:15px;font-weight:600;white-space:nowrap}.test-agent:hover{background:#f7f7f7}.toast{position:absolute;bottom:84px;left:50%;transform:translate(-50%,14px);padding:11px 16px;background:#262a29;color:white;border-radius:9px;font-size:13px;box-shadow:0 6px 22px #0002;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}.toast.show{opacity:1;transform:translate(-50%,0)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:760px){body{padding:0;background:#fff}.modal{width:100vw;height:100dvh;min-height:0;border-radius:0}.main{grid-template-columns:1fr;grid-template-rows:auto 1fr}.left{padding:18px 18px 12px;max-height:35vh}.left h1{font-size:23px;margin:0 0 6px}.intro{font-size:13px;margin-bottom:12px}.crawler{display:none}.list{display:flex;overflow:auto;padding:1px 0 5px;gap:8px}.item{flex:none;width:min(75vw,290px);padding:10px}.item.active{padding:9px}.doc{width:36px;height:36px}.right{padding:12px;min-height:0}.right-top{margin-bottom:9px}.card{border-radius:12px}.card-head{padding:11px}.article-icon{width:38px;height:38px}.title-input{height:43px;font-size:15px;padding:0 10px}.toolbar{height:auto;min-height:48px;padding:4px 8px;flex-wrap:wrap}.tool{width:39px;height:38px;font-size:21px}.tool-sep{height:28px;margin:0 5px}.archive-confirm{margin:10px 12px 0;align-items:flex-start;flex-wrap:wrap}.archive-copy{flex-basis:calc(100% - 36px)}.archive-buttons{margin-left:34px;flex-wrap:wrap}.archive-button,.cancel-button,.publish-button{font-size:11px;padding:8px 10px}.article-editor{margin:14px 12px;padding:15px;min-height:120px;font-size:13px}.card-actions{min-height:58px;padding:9px 12px}.footer{height:58px;padding:0 12px;gap:8px}.footer-link{font-size:11px;gap:4px}.footer-link svg{width:13px;height:13px}.test-agent{font-size:11px;padding:9px 10px}.quiet{font-size:13px;padding:6px}.toast{bottom:70px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
  <div class="scrim" aria-hidden="true"></div>
  <main class="modal" role="dialog" aria-modal="true" aria-labelledby="page-title">
    <div class="main">
      <section class="left" aria-label="Generated articles">
        <h1 id="page-title">Review knowledge</h1>
        <p class="intro">Review the content AI generated from your website, and publish drafts to help your AI agent answer more.</p>
        <div class="crawler"><span class="doc" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg></span><span class="copy"><span class="item-title">AI agent crawler</span><span class="status"><span class="dot complete"></span>Crawl completed</span></span></div>
        <div class="list" id="article-list"></div>
      </section>
      <section class="right" aria-label="Article editor">
        <div class="right-top"><span class="tag">Article content</span><button class="close" id="close-x" aria-label="Close dialog">×</button></div>
        <article class="card">
          <header class="card-head">
            <div class="article-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3.8h7l5 5V20a1.5 1.5 0 0 1-1.5 1.5h-10A1.5 1.5 0 0 1 6 20V5.3A1.5 1.5 0 0 1 7.5 3.8Z"/><path d="M14 4v5h5M9 13h6M9 16.5h6"/></svg></div>
            <label class="sr-only" for="title-input">Article title</label><input class="title-input" id="title-input" aria-label="Article title" />
          </header>
          <div class="toolbar" role="toolbar" aria-label="Text formatting">
            <button class="tool" type="button" data-command="bold" aria-label="Bold" aria-pressed="false"><strong>B</strong></button>
            <button class="tool" type="button" data-command="italic" aria-label="Italic" aria-pressed="false"><em>I</em></button>
            <button class="tool" type="button" data-command="underline" aria-label="Underline" aria-pressed="false"><u>U</u></button>
            <span class="tool-sep" aria-hidden="true"></span>
            <button class="tool" type="button" data-command="insertUnorderedList" aria-label="Bulleted list" aria-pressed="false">☷</button>
            <button class="tool" type="button" data-command="insertOrderedList" aria-label="Numbered list" aria-pressed="false">☷₁</button>
          </div>
          <div class="archive-confirm" id="archive-confirm" role="group" aria-label="Confirm archive" hidden><div class="archive-copy"><strong>Archive this article?</strong><span>It will leave this review list. You can manage it later in Knowledge admin.</span></div><div class="archive-buttons"><button class="cancel-button" id="cancel-archive" type="button">Cancel</button><button class="archive-button" id="confirm-archive" type="button">Archive article</button></div></div>
          <div class="article-editor" id="article-editor" contenteditable="true" role="textbox" aria-label="Article content" aria-multiline="true" spellcheck="true"></div>
          <div class="card-actions"><button class="archive-button" id="archive-button" type="button">Archive article</button><span class="actions-spacer"></span><button class="publish-button" id="publish-button" type="button">Publish</button></div>
        </article>
      </section>
    </div>
    <footer class="footer"><button class="quiet" id="close-button">Close</button><a class="footer-link" href="https://support.zendesk.com/hc/en-us/articles/9185667124506-Editing-articles-in-the-knowledge-base" target="_blank" rel="noopener noreferrer">Edit in Knowledge admin <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9 2h5v5M14 2 7 9"/><path d="M12 9v4H3V4h4"/></svg></a><button class="test-agent" id="test-agent">Test your AI agent again</button></footer>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <script>
    const articles=[
      {title:"Company overview",status:"Published",body:`<h2>Office location and availability</h2><p>Hey Ricochet is based in Buda, Texas and offers in-person support during set office hours. You’re welcome to stop by during the times below, or schedule a Friday appointment for a dedicated visit.</p><h2>Office hours</h2><ul><li>Tuesdays: 10:30 am – 12:30 pm</li><li>Thursdays: 9:30 am – 12:30 pm</li><li>Fridays: By appointment (please book in advance through the company’s contact options)</li></ul><h2>Tips for visiting</h2><ul><li>For Friday visits, schedule ahead using the available contact channels.</li><li>If you’re making a special trip, consider reaching out through the contact options first to confirm availability.</li><li>For business or bulk inquiries, you can also use the wholesale option to connect with the team.</li></ul>`},
      {title:"When can I visit in person?",status:"Draft",body:`<h2>When can I visit in person?</h2><p>Our team welcomes visitors by appointment. Contact us before your visit so we can confirm availability and help you plan your trip.</p><p>To arrange a visit, reach out through our contact page with your preferred date and the number of people attending.</p>`},
      {title:"{Article title}",status:"Draft",body:`<h2>About our products</h2><p>Learn more about the products and services we offer. Contact our team if you need help finding the right option.</p>`},
      {title:"{Article title}",status:"Draft",body:`<h2>Contact and support</h2><p>Find the right way to reach our team and get help with your questions.</p>`},
      {title:"{Article title}",status:"Draft",body:`<h2>Frequently asked questions</h2><p>Answers to common questions about our company and services.</p>`},
      {title:"{Article title}",status:"Draft",body:`<h2>Getting started</h2><p>Here are a few things to know as you get started.</p>`}
    ];
    const storageKey='zendesk-quick-edit-auto-save-v1';
    try{const stored=localStorage.getItem(storageKey);if(stored){const parsed=JSON.parse(stored);if(Array.isArray(parsed))articles.splice(0,articles.length,...parsed)}}catch{}
    let selected=0,saveTimer=null;
    const list=document.querySelector('#article-list'),titleInput=document.querySelector('#title-input'),editor=document.querySelector('#article-editor'),toast=document.querySelector('#toast'),archiveConfirm=document.querySelector('#archive-confirm'),publishButton=document.querySelector('#publish-button');
    function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function persistArticles(){try{localStorage.setItem(storageKey,JSON.stringify(articles))}catch{toastMsg('Could not auto-save. Keep this tab open and try again.')}}
    function toastMsg(message){toast.textContent=message;toast.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.classList.remove('show'),2600)}
    function renderList(){list.innerHTML=articles.map((a,i)=>`<button class="item ${i===selected?'active':''}" data-index="${i}" aria-current="${i===selected?'true':'false'}"><span class="doc" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 2.8h8l5 5V21a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3.8a1 1 0 0 1 1-1Zm7 1.8v4h4"/></svg></span><span class="copy"><span class="item-title">${escapeHtml(a.title)}</span><span class="status"><span class="dot ${a.status==='Published'?'published':''}"></span>${escapeHtml(a.status)}</span></span></button>`).join('');list.querySelectorAll('.item').forEach(b=>b.addEventListener('click',()=>selectArticle(Number(b.dataset.index))))}
    function renderSelected(){if(!articles.length){titleInput.value='';titleInput.placeholder='All articles reviewed';titleInput.disabled=true;editor.innerHTML='<p>All articles have been reviewed.</p>';editor.contentEditable='false';document.querySelector('#archive-button').disabled=true;publishButton.disabled=true;renderList();return}const a=articles[selected];titleInput.disabled=false;titleInput.placeholder='Article title';titleInput.value=a.title;editor.contentEditable='true';editor.innerHTML=a.body;archiveConfirm.hidden=true;document.querySelector('#archive-button').disabled=false;publishButton.disabled=false;publishButton.textContent=a.status==='Published'?'Update article':'Publish';renderList()}
    function syncArticle(){if(!articles.length)return;articles[selected].title=titleInput.value.trim()||'Untitled article';articles[selected].body=editor.innerHTML;renderList();clearTimeout(saveTimer);saveTimer=setTimeout(persistArticles,450)}
    function selectArticle(index){if(index===selected||index<0||index>=articles.length)return;clearTimeout(saveTimer);persistArticles();selected=index;archiveConfirm.hidden=true;renderSelected()}
    function publishCurrent(){if(!articles.length)return;clearTimeout(saveTimer);syncArticle();clearTimeout(saveTimer);articles[selected].status='Published';persistArticles();renderSelected();toastMsg('Article published.')}
    function archiveCurrent(){if(!articles.length)return;const archived=articles.splice(selected,1)[0];clearTimeout(saveTimer);selected=Math.min(selected,articles.length-1);persistArticles();archiveConfirm.hidden=true;renderSelected();toastMsg(`“${archived.title}” archived.`)}
    titleInput.addEventListener('input',syncArticle);editor.addEventListener('input',syncArticle);
    document.querySelectorAll('.tool').forEach(button=>{button.addEventListener('mousedown',event=>event.preventDefault());button.addEventListener('click',()=>{editor.focus();document.execCommand(button.dataset.command,false,null);button.setAttribute('aria-pressed',document.queryCommandState(button.dataset.command));syncArticle()})});
    document.querySelector('#publish-button').addEventListener('click',publishCurrent);
    document.querySelector('#archive-button').addEventListener('click',()=>{archiveConfirm.hidden=false;document.querySelector('#confirm-archive').focus()});
    document.querySelector('#confirm-archive').addEventListener('click',archiveCurrent);
    document.querySelector('#cancel-archive').addEventListener('click',()=>{archiveConfirm.hidden=true;document.querySelector('#archive-button').focus()});
    document.querySelector('#test-agent').addEventListener('click',()=>toastMsg('Your AI agent is ready to test.'));
    function closeReview(){clearTimeout(saveTimer);persistArticles();toastMsg('Review complete')}
    document.querySelector('#close-button').addEventListener('click',closeReview);document.querySelector('#close-x').addEventListener('click',closeReview);
    renderSelected();
</script>
</body>
</html>
